<!doctype html>
<!-- 30 s, 1080x1080 Sazen promo, colour variation: each app's chapter takes its icon colour. Every frame is a pure function of time: render.cjs calls window.render(t) and captures it. -->
<meta charset="utf-8">
<title>Sazen Promo Colour</title>
<style>
@font-face{font-family:Anton;src:url('../../public/fonts/anton.woff2')}
@font-face{font-family:GS;src:url('../../public/fonts/google-sans.woff2')}
:root{--ivory:#f4f2ec;--ink:#111110;--muted:#6b6a64}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;overflow:hidden;background:var(--ivory)}
body{font-family:GS,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
#stage{position:relative;width:1080px;height:1080px;overflow:hidden;background:var(--ivory)}
.layer{position:absolute;inset:0}
.d{font-family:Anton;text-transform:uppercase;font-weight:400;line-height:.9;white-space:nowrap}
.mask{display:block;overflow:hidden;padding-bottom:.04em}
.mask>span{display:block}
.muted{color:var(--muted)}
svg.s{display:block;fill:currentColor}

/* 1 · Intro */
#intro .l1{position:absolute;left:0;right:0;top:230px;text-align:center}
#intro .l2{position:absolute;left:0;right:0;top:660px;text-align:center}
#intro .icons{position:absolute;left:95px;top:475px;display:flex;gap:20px}
#intro .icons img{width:110px;height:110px;border-radius:28px;box-shadow:0 18px 34px -18px rgba(20,18,12,.5)}

/* 2 · Colour chapters */
.ch{background:var(--bg);color:var(--fg);visibility:hidden}
.ch .head{position:absolute;left:0;right:0;top:64px;display:flex;flex-direction:column;align-items:center;text-align:center}
.ch .head img{width:92px;height:92px;border-radius:24px;box-shadow:0 14px 30px -16px rgba(0,0,0,.45)}
.ch .cat{margin-top:22px;font-size:17px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;opacity:.65}
.ch .name{margin-top:14px}
.ch .headline{margin-top:16px;font-size:32px;line-height:1.2}
.ch .ph{position:absolute;left:50%;top:478px;width:250px;margin-left:-125px;transform-origin:50% 100%}
.ch .next{position:absolute;left:918px;top:918px;width:96px;height:96px;border-radius:26px;box-shadow:0 14px 30px -14px rgba(0,0,0,.5)}
.ch .next.end{display:grid;place-items:center;background:var(--ivory);color:var(--ink)}
.ch .next.end .s{width:46px;height:46px}

.phone-render{display:block;position:relative;width:100%;aspect-ratio:1470/3000;container-type:inline-size;--screen-bg:#fffffa;--status-image:url('../../public/images/device/statusbar-light.png');filter:drop-shadow(0 22px 18px rgba(0,0,0,.32))}
.phone-render.phone-dark{--screen-bg:#080d09;--status-image:url('../../public/images/device/statusbar-dark.png')}
.phone-screen{position:absolute;inset:2.23% 5.1%;border-radius:15% / 7%;overflow:hidden;background:var(--screen-bg);display:flex;flex-direction:column}
.phone-content{position:relative;display:block;min-height:0;flex:1}
.phone-content img{display:block;width:100%;height:100%;object-fit:fill}
.phone-status{display:block;flex:0 0 6.2%;background:var(--screen-bg) var(--status-image) center 2.1cqw / 88% auto no-repeat;z-index:2}
.phone-status-overlay{position:absolute;top:0;left:0;right:0;height:4%}
.phone-mask-status .phone-status-overlay{height:6.5%}
.phone-bezel{position:absolute;inset:0;z-index:3;background:url('../../public/images/device/rafeeq-bezel.png') center / 100% 100% no-repeat;clip-path:inset(.45% 1% round 17.5% / 8.6%)}

/* 3 · End card */
#end{background:var(--ivory);visibility:hidden}
#end .lock{position:absolute;left:0;right:0;top:150px;display:flex;justify-content:center;align-items:center;gap:24px}
#end .lock .s{width:104px;height:104px}
#end .lock .d{font-size:132px;line-height:1}
#end .lines{position:absolute;left:0;right:0;top:330px;display:flex;flex-direction:column;align-items:center}
#end .icons{position:absolute;left:0;right:0;top:620px;display:flex;justify-content:center;gap:16px}
#end .icons img{width:88px;height:88px;border-radius:23px;box-shadow:0 14px 30px -16px rgba(20,18,12,.45)}
#end .act{position:absolute;left:0;right:0;top:770px;display:flex;justify-content:center;align-items:center;gap:26px}
#end .cta{display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:var(--ivory);font-weight:600;font-size:24px;padding:20px 32px;border-radius:999px}
#end .url{font-size:28px;font-weight:600}
</style>

<svg width="0" height="0" style="position:absolute"><defs><g id="S"><path d="M118.95 -300H-75A187.5 187.5 0 0 0 -75 75H75A37.5 37.5 0 0 1 75 150H-170.55A32.25 32.25 0 0 0 -170.55 214.5H-80.25A10.5 10.5 0 0 1 -80.25 235.5H-118.95A32.25 32.25 0 0 0 -118.95 300H75A187.5 187.5 0 0 0 75 -75H-75A37.5 37.5 0 0 1 -75 -150H170.55A32.25 32.25 0 0 0 170.55 -214.5H80.25A10.5 10.5 0 0 1 80.25 -235.5H118.95A32.25 32.25 0 0 0 118.95 -300Z"/><rect x="172.20" y="-300.00" width="90.30" height="64.50" rx="32.25"/><rect x="-262.50" y="235.50" width="90.30" height="64.50" rx="32.25"/></g></defs></svg>

<div id="stage">
  <section class="layer" id="intro">
    <span class="mask d l1"><span>Different worlds.</span></span>
    <div class="icons"></div>
    <span class="mask d l2"><span class="muted">One studio.</span></span>
  </section>
  <div id="chapters"></div>
  <section class="layer" id="end">
    <div class="lock"><svg class="s" viewBox="-300 -300 600 600"><use href="#S"/></svg><span class="mask d"><span>Sazen</span></span></div>
    <div class="lines">
      <span class="mask d"><span>Different worlds.</span></span>
      <span class="mask d"><span class="muted">One studio.</span></span>
    </div>
    <div class="icons"></div>
    <div class="act">
      <span class="cta"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 2.5v19l10-9.5L3 2.5Zm1.5-1L16 8.1l-2 2.1L4.5 1.5Zm12.8 7.4 3.2 1.8c1 .6 1 2 0 2.6l-3.2 1.8L14.1 12l3.2-3.1ZM16 15.9 4.5 22.5l9.5-8.7 2 2.1Z"/></svg>Google Play</span>
      <span class="url">teamsazen.com</span>
    </div>
  </section>
</div>

<script>
// App copy mirrors src/data/apps.ts (name, category, headline); bg/fg are sampled from each app icon.
const apps = [
  {slug:'quran-khatam-tracker',name:'Quran Khatam Tracker',category:'Faith & reflection',headline:'Make every ayah count.',bg:'#22d342',fg:'#0b1a0e'},
  {slug:'exit-rush',name:'Exit Rush',category:'Games',headline:'Every arrow wants out.',bg:'#f4f8fb',fg:'#111110'},
  {slug:'rafeeq',name:'Rafeeq',category:'Faith & reflection',headline:'A little closer. Every day.',bg:'#033737',fg:'#f3e2c3'},
  {slug:'budget-ai',name:'Budget AI',category:'Everyday tools',headline:'Less logging. More living.',bg:'#f4f8fb',fg:'#020408'},
  {slug:'99-names',name:'99 Names',category:'Faith & reflection',headline:'Beautiful names. Deeper meaning.',bg:'#10181e',fg:'#ffffff'},
  {slug:'fm-crafts',name:'FM Crafts',category:'Shopping & gifts',headline:'Find something made with love.',bg:'#2ebf70',fg:'#111113'},
  {slug:'salahlog',name:'SalahLog',category:'Faith & reflection',headline:'Small steps. A steady practice.',bg:'#f1b97a',fg:'#111110'},
];
const IMG = '../../public/images/';
const icon = a => `${IMG}${a.slug}/icon.webp`;
const params = new URLSearchParams(location.search);
const FRAMES = params.get('frames'); // dir of Exit Rush gameplay JPGs (f001.jpg…), made by render.cjs
const NFRAMES = +(params.get('nframes') || 0);
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const out = x => 1 - Math.pow(1 - x, 4);
const expo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const show = (el, on) => { el.style.visibility = on ? 'visible' : 'hidden'; };
const line = (el, x, y = 0) => { el.firstElementChild.style.transform = `translateY(${(1 - out(x)) * 110 - io(y) * 110}%)`; };
// Chapter k is fully revealed at OPEN + k * CH; its colour wipes in over WIPE seconds before that.
const OPEN = 2.9, CH = 3.25, WIPE = .55, END = OPEN + 7 * CH;
const FIRST = [95 + 55, 475 + 55], CHIP = [966, 966];
const R = Math.hypot(1080, 1080);

function phone(a, i, cls, id = '') {
  const addStatus = ['quran-khatam-tracker','99-names'].includes(a.slug);
  const overlay = ['exit-rush','salahlog'].includes(a.slug);
  const dark = a.slug === 'quran-khatam-tracker' || (a.slug === 'salahlog' && i === 1);
  const src = id && FRAMES ? `${FRAMES}/f001.jpg` : `${IMG}${a.slug}/${i}.webp`;
  return `<div class="${cls}"><span class="phone-render ${dark?'phone-dark':''} ${a.slug==='salahlog'?'phone-mask-status':''}"><span class="phone-screen">${addStatus?'<span class="phone-status"></span>':''}<span class="phone-content"><img src="${src}" ${id?`id="${id}"`:''}></span>${overlay?'<span class="phone-status phone-status-overlay"></span>':''}</span><span class="phone-bezel"></span></span></div>`;
}

$('#intro .icons').innerHTML = $('#end .icons').innerHTML = apps.map(a => `<img src="${icon(a)}">`).join('');
$('#chapters').innerHTML = apps.map((a, k) => `<section class="layer ch" style="--bg:${a.bg};--fg:${a.fg}">
  <div class="head"><img src="${icon(a)}"><span class="cat">${a.category}</span><span class="mask d name"><span>${a.name}</span></span><p class="headline">${a.headline}</p></div>
  ${phone(a, 2, 'ph left')}${phone(a, 3, 'ph right')}${phone(a, 1, 'ph center', a.slug === 'exit-rush' ? 'vid' : '')}
  ${k < 6 ? `<img class="next" src="${icon(apps[k + 1])}">` : '<div class="next end"><svg class="s" viewBox="-300 -300 600 600"><use href="#S"/></svg></div>'}
</section>`).join('');

function fit(els, width, cap) { els.forEach(e => e.style.fontSize = '200px'); const w = Math.max(...els.map(e => e.firstElementChild.scrollWidth)); const f = Math.min(cap, 200 * width / w); els.forEach(e => e.style.fontSize = f + 'px'); }
const wipe = (el, x, [cx, cy]) => { el.style.clipPath = x >= 1 ? 'none' : `circle(${io(x) * R}px at ${cx}px ${cy}px)`; };

let lastVid = '';
window.render = async function (t) {
  // 1 · Intro: headline, the seven icons, and the first icon floods the frame with its colour.
  show($('#intro'), t < OPEN);
  line($('#intro .l1'), prog(t, .15, .9));
  line($('#intro .l2'), prog(t, .9, 1.6));
  $$('#intro .icons img').forEach((el, i) => {
    const e = prog(t, .45 + i * .08, 1.05 + i * .08), lift = out(prog(t, 2.0, 2.4)) * (i ? 1 : 0);
    el.style.transform = `translateY(${(1 - out(e)) * 40 - lift * 12}px) scale(${back(e) * (i === 0 ? 1 + out(prog(t, 2.0, 2.4)) * .15 : 1)})`;
    el.style.opacity = clamp(e * 3);
  });

  // 2 · Chapters.
  for (const [k, ch] of $$('.ch').entries()) {
    const w = OPEN + k * CH - WIPE, u = t - w, on = u >= 0 && u < CH + WIPE;
    show(ch, on);
    if (!on) continue;
    wipe(ch, u / WIPE, k ? CHIP : FIRST);
    const head = $('.head', ch);
    $('img', head).style.transform = `scale(${back(prog(u, .3, .9))})`;
    $('.cat', head).style.opacity = out(prog(u, .45, .95)) * .65;
    line($('.name', head), prog(u, .45, 1.15));
    const h = out(prog(u, .7, 1.3));
    $('.headline', head).style.opacity = h; $('.headline', head).style.transform = `translateY(${(1 - h) * 18}px)`;
    const rise = expo(prog(u, .4, 1.4)), fan = expo(prog(u, .8, 1.8)), bob = Math.sin(u * 2) * 5;
    $('.center', ch).style.transform = `translateY(${(1 - rise) * 560 + bob}px)`;
    [['.left', -1], ['.right', 1]].forEach(([sel, s]) => {
      $(sel, ch).style.transform = `translate(${s * fan * 215}px,${(1 - rise) * 560 + 36 - bob}px) rotate(${s * fan * 11}deg) scale(${lerp(.8, .86, fan)})`;
    });
    const nx = $('.next', ch), ne = prog(u, CH - .7, CH - .2);
    nx.style.transform = `scale(${back(ne)}) rotate(${(1 - out(ne)) * -20}deg)`;
    nx.style.opacity = clamp(ne * 3);
    if (apps[k].slug === 'exit-rush' && FRAMES && NFRAMES) {
      const f = `${FRAMES}/f${String(Math.floor(u * 30) % NFRAMES + 1).padStart(3, '0')}.jpg`;
      if (f !== lastVid) { lastVid = f; const v = $('#vid'); v.src = f; await v.decode().catch(() => {}); }
    }
  }

  // 3 · End card wipes in from the last chip.
  const e0 = END - WIPE, ue = t - e0;
  show($('#end'), ue >= 0);
  if (ue >= 0) {
    wipe($('#end'), ue / WIPE, CHIP);
    const a = expo(prog(ue, .4, 1.3)), s = $('#end .lock .s');
    s.style.transform = `rotate(${(1 - a) * -40}deg) scale(${lerp(.5, 1, a)})`; s.style.opacity = a;
    line($('#end .lock .mask'), prog(ue, .5, 1.3));
    $$('#end .lines .mask').forEach((m, i) => line(m, prog(ue, .8 + i * .14, 1.6 + i * .14)));
    $$('#end .icons img').forEach((el, i) => { const e = prog(ue, 1.3 + i * .06, 1.9 + i * .06); el.style.transform = `translateY(${(1 - out(e)) * 26}px) scale(${back(e)})`; el.style.opacity = clamp(e * 3); });
    const act = out(prog(ue, 1.9, 2.6));
    $('#end .act').style.opacity = act; $('#end .act').style.transform = `translateY(${(1 - act) * 22}px)`;
  }
};

window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  fit([$('#intro .l1'), $('#intro .l2')], 940, 150);
  $$('.ch .name').forEach(n => fit([n], 940, 150));
  fit($$('#end .lines .mask'), 900, 118);
  await window.render(+(params.get('t') || 0));
  return true;
})();
</script>
